<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!-- Mobile Meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <!-- Site Meta -->
  <title>Ask Money - facePay</title>
  <meta name="keywords" content="ask money, face recognition, UPI, facePay">
  <meta name="description" content="Request money securely using live facial recognition with facePay.">
  <meta name="author" content="facePay Team">
  <!-- CSS Files -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='images/fevicon.png') }}" type="image/gif">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">
</head>
<body class="main-layout inner_page">
  <div class="container my-5">
    <div class="row">
      <div class="col-md-12">
        <h2 class="text-center">Scan Target's Face for Money Request</h2>
        <p class="text-center">Please capture the face of the person you wish to request money from.</p>
      </div>
    </div>
    <form method="POST" action="{{ url_for('ask') }}">
      <div class="row">
        <!-- Live Video Feed Card -->
        <div class="col-md-12">
          <div class="card shadow-sm">
            <div class="card-header text-center bg-primary text-white">
              Live Camera Feed
            </div>
            <div class="card-body">
              <video id="ask-video" width="100%" autoplay muted style="border: 1px solid #ccc; border-radius: 5px; max-height:300px;"></video>
            </div>
          </div>
        </div>
        <!-- Capture & Confirm Button -->
        <div class="col-md-12 text-center mt-3">
          <button type="button" class="btn btn-success" onclick="captureAndConfirmAsk()">Capture & Confirm</button>
        </div>
        <!-- Captured Image Preview Card -->
        <div class="col-md-12 mt-3">
          <div class="card shadow-sm">
            <div class="card-header text-center bg-secondary text-white">
              Captured Image
            </div>
            <div class="card-body">
              <img id="ask-capturedImage" src="" alt="Captured Face" style="max-width:100%; display:none; border:1px solid #ccc; border-radius:5px;">
            </div>
          </div>
        </div>
        <!-- Hidden Input for Captured Image -->
        <input type="hidden" id="ask-captured_image" name="captured_image">
        <!-- Proceed Button -->
        <div class="col-md-12 text-center mt-3">
          <button type="submit" class="btn btn-primary">Proceed to Request Money</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Javascript Files -->
  <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
  <script>
    // Setup live video feed for ask_scan page
    const askVideo = document.getElementById('ask-video');
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(function(stream) {
          askVideo.srcObject = stream;
          askVideo.play();
        })
        .catch(function(err) {
          console.error("Error accessing camera: " + err);
        });
    }

    // Combined Capture & Confirm function for ask_scan
    function captureAndConfirmAsk() {
      const canvas = document.createElement('canvas');
      canvas.width = askVideo.videoWidth;
      canvas.height = askVideo.videoHeight;
      const context = canvas.getContext('2d');
      context.drawImage(askVideo, 0, 0, canvas.width, canvas.height);
      // Compress the image as JPEG at 50% quality
      const dataURL = canvas.toDataURL('image/jpeg', 0.5);
      // Display the captured image in the preview card
      document.getElementById('ask-capturedImage').src = dataURL;
      document.getElementById('ask-capturedImage').style.display = 'block';
      // Store the dataURL in the hidden input for form submission
      document.getElementById('ask-captured_image').value = dataURL;
      alert("Face captured and confirmed. You can now proceed with your money request.");
    }
  </script>
</body>
</html>
