<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!-- Mobile Meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Request Money - facePay</title>
  
  <!-- CSS Files -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='images/fevicon.png') }}" type="image/gif">
</head>
<body class="main-layout inner_page">
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-header text-center bg-primary text-white">
            <h3>Request Money</h3>
          </div>
          <div class="card-body">
            <p class="text-center lead">
              Target: <strong>{{ target_name }}</strong>
            </p>
            <p class="text-center">
              UPI ID: <strong>{{ target_upi }}</strong>
            </p>
            <hr>
            <form method="POST" action="{{ url_for('ask') }}">
              <div class="form-group">
                <label for="amount">Enter Request Amount:</label>
                <input type="number" step="0.01" name="amount" id="amount" class="form-control" placeholder="e.g., 50.00" required>
              </div>
              <!-- Optional: Include the target UPI in a hidden field if needed -->
              <input type="hidden" name="target_upi" value="{{ target_upi }}">
              <button type="submit" class="btn btn-success btn-block mt-3">Submit Request</button>
            </form>
          </div>
          <div class="card-footer text-center">
            <small class="text-muted">Please double-check the request amount before submitting.</small>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Javascript Files -->
  <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
